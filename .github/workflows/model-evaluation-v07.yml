name: ALFRED bounded real-model experiment
on:
  push:
    branches: [feat/alfred-conversation-2026-09-26]
    paths: [tools/evaluate_real_model.py, .github/workflows/model-evaluation-v07.yml]
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: /tmp/alfred-eval-models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify fixed runtime and model bytes, no installation script
        run: |
          set -euo pipefail
          mkdir -p /tmp/alfred-eval-runtime docs/evidence/conversation-v07/model
          curl --fail --location --retry 2 --max-time 240 --max-filesize 1600000000 'https://github.com/ollama/ollama/releases/download/v0.34.4/ollama-linux-amd64.tar.zst' -o /tmp/ollama.tar.zst
          echo 'c238986e61d40c0cc5f4a9b9e40b9eea104350b77efa34741fc134e105cb9533  /tmp/ollama.tar.zst' | sha256sum -c -
          tar --zstd -xf /tmp/ollama.tar.zst -C /tmp/alfred-eval-runtime
          curl --fail --location --retry 2 --max-time 240 --max-filesize 1200000000 'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/62a8d092b0a1047016f3edbd0fde387598727aa5/qwen2.5-1.5b-instruct-q4_k_m.gguf' -o /tmp/alfred-eval-qwen.gguf
          echo '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  /tmp/alfred-eval-qwen.gguf' | sha256sum -c -
          curl --fail --location --max-time 30 'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/raw/62a8d092b0a1047016f3edbd0fde387598727aa5/LICENSE' -o docs/evidence/conversation-v07/model/QWEN-LICENSE.txt
          curl --fail --location --max-time 30 'https://raw.githubusercontent.com/ollama/ollama/v0.34.4/LICENSE' -o docs/evidence/conversation-v07/model/OLLAMA-LICENSE.txt
      - name: Run tool-free local inference on fictional notes only
        run: |
          set -euo pipefail
          /tmp/alfred-eval-runtime/bin/ollama serve > /tmp/alfred-ollama.log 2>&1 &
          OLLAMA_PID=$!
          trap 'kill "$OLLAMA_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do if curl --fail --silent http://127.0.0.1:11434/api/version > docs/evidence/conversation-v07/model/runtime.json; then break; fi; sleep 1; done
          printf 'FROM /tmp/alfred-eval-qwen.gguf\nPARAMETER num_ctx 4096\nPARAMETER temperature 0\n' > /tmp/Modelfile
          /tmp/alfred-eval-runtime/bin/ollama create alfred-eval -f /tmp/Modelfile
          python3 tools/evaluate_real_model.py
          /tmp/alfred-eval-runtime/bin/ollama ps > docs/evidence/conversation-v07/model/loaded-model.txt
      - name: Preserve actual results, including failed cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alfred-v07-real-model-evidence
          path: docs/evidence/conversation-v07/model
          retention-days: 7
