name: Console refinement acceptance
on:
  push:
    branches: [feat/alfred-console-refinement-2026-09-27]
    paths: ['console/**', '!console/docs/**', '!console/README.md', '.github/workflows/console-refinement.yml']
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact locked toolchain
        working-directory: console
        run: |
          set -euo pipefail
          npm install -g npm@11.20.0
          npm ci
          npm ls --depth=0 > dependency-versions.txt
          npm audit --json > dependency-audit.json || true
      - name: Typecheck, build, unit tests and offline preview
        working-directory: console
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm run build 2>&1 | tee evidence/build.txt
          npm test 2>&1 | tee evidence/unit-tests.txt
          npm run standalone
      - name: Install browser
        working-directory: console
        run: npx playwright install --with-deps chromium
      - name: Real rendering and interaction acceptance
        working-directory: console
        run: npm run test:browser
      - name: Preserve source and evidence
        if: always()
        run: |
          mkdir -p delivery
          tar --exclude=node_modules --exclude=dist --exclude=test-results --exclude=evidence --exclude=ALFRED-Console.html -czf delivery/console-source.tar.gz console
          cp console/ALFRED-Console.html delivery/ 2>/dev/null || true
          cp -r console/evidence delivery/ 2>/dev/null || true
          cp console/dependency-versions.txt console/dependency-audit.json delivery/ 2>/dev/null || true
          git rev-parse HEAD > delivery/TESTED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alfred-console-refinement
          path: delivery/
          retention-days: 7
  preserve-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Existing plan and core regression
        run: |
          set -euo pipefail
          python3 tools/check_memory_plan.py --self-test
          python3 tools/check_memory_plan.py
          python3 -m unittest discover -s tests -v
