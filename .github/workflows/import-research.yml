name: Import pinned research sources
on:
  push:
    branches: [research/alfred-foundation-2026-09-25]
    paths: [third_party/sources.lock.json, tools/import_sources.py, tools/import_selected.py, .github/workflows/import-research.yml]
permissions:
  contents: write
concurrency:
  group: alfred-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'EmotiveImpact/Alfred'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/alfred-foundation-2026-09-25
          fetch-depth: 1
      - name: Copy inert source, preserving earlier successes
        run: |
          if ! test -f third_party/IMPORT_RECEIPT.json; then
            python3 tools/import_sources.py
          fi
          python3 tools/import_selected.py
      - name: Commit copied bytes and receipt to this research branch only
        run: |
          git config user.name 'ALFRED source importer'
          git config user.email 'alfred-importer@users.noreply.github.com'
          git add -f third_party/sources third_party/IMPORT_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit --quiet -m 'research: preserve bounded pinned source selections and exact manifests'
            git push origin HEAD:refs/heads/research/alfred-foundation-2026-09-25
          fi
      - name: Verify every copied byte and report completeness
        run: python3 tools/import_sources.py --verify
